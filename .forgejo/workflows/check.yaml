name: Flake check

on:
  # Lockfile changes are checked by the ISO workflow, which calls this one
  push:
    paths: ["**.nix"]
  # The ISO workflow only runs on master pushes, so PRs check lockfile changes here
  pull_request:
    paths: ["**.nix", flake.lock]
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: nixos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check flake
        run: nix flake check --print-build-logs
