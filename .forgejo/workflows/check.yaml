name: Flake check

on:
  # Master pushes are checked by the host and ISO workflows, which call this one
  push:
    branches-ignore: [master]
    paths: ["**.nix"]
  # The ISO workflow only runs on master pushes, so PRs check lockfile changes here
  pull_request:
    paths: ["**.nix", flake.lock]
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: nixos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check flake
        run: nix flake check --print-build-logs
